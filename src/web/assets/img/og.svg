<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Email Cleaner — delete thousands of emails without deleting the ones that matter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#131c2b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="280" fill="#2f6bff" opacity="0.13"/>
  <circle cx="180" cy="580" r="220" fill="#7c3aed" opacity="0.10"/>

  <rect x="80" y="76" width="56" height="56" rx="14" fill="url(#mark)"/>
  <text x="108" y="115" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">✦</text>
  <text x="152" y="115" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#e8eef6">Email Cleaner</text>

  <text x="80" y="245" font-family="system-ui, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Delete thousands of emails</text>
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="62" font-weight="700" fill="#ffffff">without deleting the ones</text>
  <text x="80" y="395" font-family="system-ui, sans-serif" font-size="62" font-weight="700" fill="#6f9bff">that matter.</text>

  <text x="80" y="470" font-family="system-ui, sans-serif" font-size="27" fill="#96a3b4">Clean by folder or keyword — Gmail, Outlook, Yahoo, iCloud, any IMAP.</text>

  <g font-family="system-ui, sans-serif" font-size="23" fill="#e8eef6">
    <rect x="80" y="516" width="270" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
    <text x="110" y="550">✓  Previewed first</text>
    <rect x="370" y="516" width="250" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
    <text x="400" y="550">✓  One-click undo</text>
    <rect x="640" y="516" width="300" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
    <text x="670" y="550">✓  AES-256 encrypted</text>
  </g>
</svg>
